[project]
name = "autoheal-proxy"
version = "0.1.0"
description = "Enterprise MCP AutoHeal Proxy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.23.0",
    "fakeredis>=2.20.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "groq>=1.6.0",
    "python-dotenv>=1.2.2",
    "emoji>=2.15.0",
    "asyncpg>=0.31.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
