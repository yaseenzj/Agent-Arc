[project]
name = "autoheal-proxy"
version = "0.1.0"
description = "Enterprise MCP AutoHeal Proxy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "streamlit>=1.30.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
