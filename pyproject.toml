[project]
name = "autoheal-proxy"
version = "0.1.0"
description = "Enterprise MCP AutoHeal Proxy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.23.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "groq>=1.6.0",
    "python-dotenv>=1.2.2",
    "asyncpg>=0.31.0",
    "libcst>=1.9.0",
    "websockets>=16.1.1",
    "pygithub>=2.9.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
cache_dir = ".cache/pytest"

[tool.ruff]
cache-dir = ".cache/ruff"
